[package]
name = "rust-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI application for rust-agent-framework"
default-run = "rust-agent-cli"

[[bin]]
name = "rust-agent-cli"
path = "src/main.rs"

[dependencies]
rust-agent-core = { workspace = true }
rust-agent-framework = { workspace = true }
rust-agent-client = { workspace = true }
rust-agent-workflow = { workspace = true }
rust-agent-websearch = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustyline = "15"
