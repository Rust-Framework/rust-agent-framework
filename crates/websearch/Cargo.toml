[package]
name = "rust-websearch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure Rust web search library — DuckDuckGo multi-backend, SearXNG client, with anti-detection support. No API key required."

[dependencies]
# Async runtime
tokio = { workspace = true }

# HTTP client (for search backends only)
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Async concurrency
futures-util = { workspace = true }

# HTML parsing (CSS selector based, for search result parsing only)
scraper = "0.22"

# Random number generation (UA rotation, jitter)
rand = "0.8"

# URL handling
url = "2"

# Regex for content cleaning
regex = { workspace = true }

# Servo-based browser fetch engine (JS rendering + layout-aware extraction)
# Optional — only required by the `servo-fetch-worker` binary.
# Enabled via the `servo-fetch` feature.
servo-fetch = { version = "0.12", optional = true }

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
# Enable the servo-fetch worker binary (requires mozjs/Servo native build).
servo-fetch = ["dep:servo-fetch"]

# ── servo-fetch 子进程 worker 二进制 ──
# 将 servo-fetch 运行在独立子进程中，隔离 Servo 引擎的栈溢出崩溃
# （StyleThread stack overflow / STATUS_STACK_OVERFLOW）。
# 父进程通过 spawn + timeout 调用此 worker，崩溃时自动回退到 scraper。
# 构建：`cargo build -p rust-websearch --features servo-fetch --bin servo-fetch-worker`
[[bin]]
name = "servo-fetch-worker"
path = "src/bin/servo_fetch_worker.rs"
required-features = ["servo-fetch"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
