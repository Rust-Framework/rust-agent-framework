[package]
name = "rust-agent-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Code sandbox implementations for rust-agent-framework — isolated code execution behind ICodeSandbox"

[dependencies]
rust-agent-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "fs"] }
tracing = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
wasmtime = { version = "26", optional = true, default-features = false, features = ["cranelift", "runtime"] }
wat = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["process"]
process = []
container = []
docker = []
wasm = ["dep:wasmtime", "dep:wat", "dep:base64"]
