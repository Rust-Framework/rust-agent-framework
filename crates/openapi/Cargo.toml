[package]
name = "rust-agent-openapi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenAPI spec tool resolver for rust-agent-framework — independent from core/decl defaults"

[dependencies]
rust-agent-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }
jsonschema = { version = "0.26", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
validate = ["dep:jsonschema"]
