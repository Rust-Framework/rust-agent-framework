[package]
name = "rust-agent-framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent runtime framework for building LLM-powered agents with tool-calling support"

[dependencies]
rust-agent-core = { workspace = true }
rust-agent-client = { workspace = true }
rust-agent-macros = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tracing = { workspace = true }
regex = "1"
glob = "0.3"
walkdir = "2"
dirs-next = "2"
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
tiktoken = ["dep:tiktoken-rs"]

[dependencies.tiktoken-rs]
version = "0.6"
optional = true
