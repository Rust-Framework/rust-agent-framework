[package]
name = "rust-agent-decl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Declarative agent and workflow definitions via JSON/YAML/TOML — build agents and workflows from data files"

[[example]]
name = "custom_tool_agent"
path = "examples/custom_tool_agent.rs"

[[example]]
name = "test_console"
path = "examples/test_console.rs"

[dependencies]
rust-agent-core = { workspace = true }
rust-agent-client = { workspace = true }
rust-agent-framework = { workspace = true }
rust-agent-workflow = { workspace = true }
rust-agent-rhai = { workspace = true }
rust-agent-websearch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-core = { workspace = true }
reqwest = { workspace = true }
rustyline = "15"

[features]
default = ["json"]
json = []
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]
