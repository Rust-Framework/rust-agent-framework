[package]
name = "rust-agent-decl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Declarative agent and workflow definitions via JSON/YAML/TOML — MAF AgentSchema v1.0 aligned"

[dependencies]
rust-agent-core = { workspace = true }
rust-agent-client = { workspace = true }
rust-agent-framework = { workspace = true }
rust-agent-workflow = { workspace = true }
rust-agent-websearch = { workspace = true, optional = true }
rust-agent-mcp = { workspace = true, optional = true }
rust-agent-rhai = { workspace = true, optional = true }
rust-agent-rag = { workspace = true, optional = true }
rust-agent-wiki = { workspace = true, optional = true }
rust-agent-openapi = { workspace = true, optional = true }
rust-agent-sandbox = { workspace = true, optional = true }
rust-agent-llama = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
mustache = { version = "0.9", optional = true }

[features]
default = ["json"]
json = []
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]
web = ["dep:rust-agent-websearch"]
mcp = ["dep:rust-agent-mcp"]
rhai = ["dep:rust-agent-rhai"]
rag = ["dep:rust-agent-rag"]
wiki = ["dep:rust-agent-wiki"]
openapi = ["dep:rust-agent-openapi"]
openapi-validate = ["openapi", "rust-agent-openapi/validate"]
sandbox = ["dep:rust-agent-sandbox"]
sandbox-docker = ["sandbox", "rust-agent-sandbox/docker"]
sandbox-wasm = ["sandbox", "rust-agent-sandbox/wasm"]
mustache = ["dep:mustache"]
llama = ["dep:rust-agent-llama"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
chrono = { workspace = true }
rust-agent-sandbox = { workspace = true, features = ["docker"] }
rust-agent-openapi = { workspace = true }
tempfile = { workspace = true }
