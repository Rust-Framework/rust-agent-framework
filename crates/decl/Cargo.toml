[package]
name = "rust-agent-decl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Declarative agent and workflow definitions via JSON/YAML/TOML — MAF AgentSchema v1.0 aligned"

[dependencies]
rust-agent-core = { workspace = true }
rust-agent-client = { workspace = true }
rust-agent-framework = { workspace = true }
rust-agent-workflow = { workspace = true }
rust-agent-rhai = { workspace = true }
rust-agent-websearch = { workspace = true }
rust-agent-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
powerfx = { version = "0.1", optional = true }
mustache = { version = "0.9", optional = true }

[features]
default = ["json"]
json = []
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]
powerfx = ["dep:powerfx"]
mustache = ["dep:mustache"]
