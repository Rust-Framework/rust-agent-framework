# MAF-compatible Prompt Agent definition
# This is directly parseable by rust-agent-decl and MAF clients.
kind: prompt
name: Assistant
displayName: Helpful Assistant
description: A helpful assistant that answers questions in a JSON format.
model:
  id: gpt-4o
  connection:
    kind: key
    api_key: $OPENAI_API_KEY
  options:
    kind: standard
    temperature: 0.9
    topP: 0.95
instructions: You are a helpful assistant. Answer questions briefly and clearly.
outputSchema:
  properties:
    - name: language
      kind: string
      required: true
      description: The language of the answer
    - name: answer
      kind: string
      required: true
      description: The answer text
