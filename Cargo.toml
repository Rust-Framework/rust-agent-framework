[workspace]
members = [
    "crates/core",
    "crates/client",
    "crates/framework",
    "crates/workflow",
    "crates/cli",
    "crates/macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/rf2026/rust-agent-framework"
homepage = "https://gitcode.com/rf2026/rust-agent-framework"

[workspace.dependencies]
# Internal crate dependencies
rust-agent-core = { path = "crates/core", version = "0.1.0" }
rust-agent-client = { path = "crates/client", version = "0.1.0" }
rust-agent-framework = { path = "crates/framework", version = "0.1.0" }
rust-agent-workflow = { path = "crates/workflow", version = "0.1.0" }
rust-agent-macros = { path = "crates/macros", version = "0.1.0" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"

# Async streams
futures-core = "0.3"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }

# Bytes buffer (used by SSE transport)
bytes = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot = "0.12"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Stream wrappers
tokio-stream = { version = "0.1", features = ["sync"] }
