[workspace]
members = [
    "crates/core",
    "crates/client",
    "crates/framework",
    "crates/websearch",
    "crates/websearch-ai",
    "crates/workflow",
    "crates/cli",
    "crates/macros",
    "crates/rhai",
    "crates/decl",
    "crates/workflow-cli",
    "crates/rag",
    "crates/wiki",
    "crates/host",
    "crates/mcp",
]
default-members = [
    "crates/core",
    "crates/client",
    "crates/framework",
    "crates/websearch",
    "crates/websearch-ai",
    "crates/workflow",
    "crates/cli",
    "crates/macros",
    "crates/rhai",
    "crates/decl",
    "crates/rag",
    "crates/wiki",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/rf2026/rust-agent-framework"
homepage = "https://gitcode.com/rf2026/rust-agent-framework"

[workspace.dependencies]
# Internal crate dependencies
rust-agent-core = { path = "crates/core", version = "0.1.0" }
rust-agent-client = { path = "crates/client", version = "0.1.0" }
rust-agent-framework = { path = "crates/framework", version = "0.1.0" }
rust-agent-workflow = { path = "crates/workflow", version = "0.1.0" }
rust-agent-macros = { path = "crates/macros", version = "0.1.0" }
rust-agent-rhai = { path = "crates/rhai", version = "0.1.0" }
rust-agent-decl = { path = "crates/decl", version = "0.1.0" }
rust-websearch = { path = "crates/websearch", version = "0.1.0" }
rust-agent-websearch = { path = "crates/websearch-ai", version = "0.1.0" }
rust-agent-rag = { path = "crates/rag", version = "0.1.0" }
rust-agent-host = { path = "crates/host", version = "0.1.0" }
rust-agent-mcp = { path = "crates/mcp", version = "0.1.0" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"

# Async streams
futures-core = "0.3"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "gzip", "brotli", "deflate"] }

# Bytes buffer (used by SSE transport)
bytes = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot = "0.12"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Scripting
rhai = "~1.19"

# Stream wrappers
tokio-stream = { version = "0.1", features = ["sync"] }

# Regex (shared: framework, wiki)
regex = "1"

# Filesystem traversal (shared: framework, wiki)
walkdir = "2"

# Testing utilities
tempfile = "3"
