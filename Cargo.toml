[workspace]
members = [
    "crates/core",
    "crates/client",
    "crates/llm",
    "crates/framework",
    "crates/workflow",
    "crates/cli",
    "crates/macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crate dependencies
rust-agent-core = { path = "crates/core" }
rust-agent-client = { path = "crates/client" }
rust-agent-llm = { path = "crates/llm" }
rust-agent-framework = { path = "crates/framework" }
rust-agent-workflow = { path = "crates/workflow" }
rust-agent-macros = { path = "crates/macros" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"
